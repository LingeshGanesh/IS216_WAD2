
<!doctype html>
<html>
  <head>
    <title>Demo: Get Started Debugging JavaScript with Chrome DevTools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <h1>Demo: Get Started Debugging JavaScript with Chrome DevTools</h1>
    <label for="num1">Number 1</label>
    <input placeholder="Number 1" id="num1" type="number">
    <label for="num2">Number 2</label>
    <input placeholder="Number 2" id="num2" type="number">
    <button onclick="addNumbers()">Add Number 1 and Number 2</button>

    <script>
      function addNumbers() {
        let num1 = Number(document.getElementById('num1').value);
        console.log(num1);
        let num2 = Number(document.getElementById('num2').value);
        console.log(num2);
        // TODO: add the two numbers and store the result in a variable called sum. Log the result to the console and also alert the result to the user
        let result = num1+num2;
        if (num1==="" || num2===""){
          console.log("either input is empty");
          alert("Please fill in both boxes");
          return;
        }
        console.log("the result is: "+result);
        alert("the result is: "+result);
      }
    </script>
  </body>
</html>
