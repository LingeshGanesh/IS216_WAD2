<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" 
    crossorigin="anonymous">

    <title>Registration</title>

    <style>
        /* Add your CSS here */
        body {
            text-align: center;
        }
        .topOfPage {
            padding: 50px;
            background-color: rgb(0, 123, 255);
        }
        .header {
            color: white;
            font-size: 50px;
        }
        .subheader {
            color: white;
        }
        .header2 {
            font-size: 20px;
            margin-bottom: 10px;
            margin-top: 10px;
            font-weight: bold;
        }
        table {
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        tr {
            background-color: yellow;
            padding: 20px;
        }
        td {
            text-align: left;
        }
        .title1 {
            color: maroon;
            font-weight: bold;
            padding: 10px;
        }
        .title2 {
            color: green;
            font-weight: bold;
            padding: 10px;
        }
        .timeslotForm {
            background-color: rgb(238, 168, 168);
            padding: 10px;
        }
        #colorsForm {
            border: 1px solid red;
            background-color: rgb(220, 246, 255);
            padding: 10px;
        }
    </style>

</head>

<body>
    <div class="topOfPage">
        <div class="header">Registration Page</div>
        <div class="subheader">Enter the details to register</div>
    </div>
    <br>
    <div class="col-10 offset-1">
        <div class="header2">About You</div>
        <table class="table table-borderless">
            <tr>
                <td style="width: 50%;">
                    <div class="title1">First Name <span class="badge bg-success">must</span></div>
                    <input type="text" placeholder="First Name" style="width: 100%; box-sizing: border-box;">
                </td>
                <td style="width: 50%;">
                    <div class="title1">Last Name <span class="badge bg-success">must</span></div>
                    <input type="text" placeholder="Last Name" style="width: 100%; box-sizing: border-box;">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div class="title2">User Name <span class="badge bg-success">must</span></div>
                    <input type="text" placeholder="Username" style="width: 100%; box-sizing: border-box;">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div class="title2">Email <span class="badge bg-success">must</span></div>
                    <input type="text" placeholder="Email" style="width: 100%; box-sizing: border-box;">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div class="title2">Short Description</div>
                    <textarea class="form-control" rows="2" placeholder="write a short description about yourself"></textarea>
                </td>
            </tr>
        </table>
        <div class="header2">Choose Timeslot</div>
        <div class="timeslotForm">
            <div style="text-align: left; padding-bottom: 10px;">Timeslot</div>
            <select id="timeslot" style="width: 100%; box-sizing: border-box;">
                <option value="1">0800 - 1000</option>
                <option value="2">1000 - 1200</option>
                <option value="3">1200 - 1400</option>
                <option value="4">1400 - 1600</option>
                <option value="5">1600 - 1800</option>
            </select>
        </div>

        <div class="header2">Choose Colors</div>
        <div id="colorsForm">
            <div style="text-align: left;">
                <label style="color: red; font-weight:bold"><input type="checkbox"> Red</label><br>
                <label style="color: green; font-weight:bold"><input type="checkbox"> Green</label><br>
                <label style="color: yellow; font-weight:bold"><input type="checkbox"> Yellow</label>
            </div>
            
        </div>
        <div class="d-flex justify-content-start" style="margin-top: 15px;">
            <button class="btn btn-primary" style="justify-content: left;">Submit</button>
        </div>
        

    </div>










    <!-- Optional JavaScript -->
    <!-- Bundled Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" 
    crossorigin="anonymous"></script>

</body>

</html>
