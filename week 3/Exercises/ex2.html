<!doctype html>
<html lang="en">

<head>
    
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        .box{
            background-color: gold;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <div class="container-fluid" style="background-color: grey;">
        <div class="row justify-content-center">
            <div class="box col-12 col-md-3">1 of 2</div>
            <div class="box col-12 col-md-3">2 of 2</div>
        </div>
        <div class="row">&nbsp;</div>
        <div class="row">
            <div class="box col-12 col-md-3">1 of 3</div>
            <div class="box col-12 col-md-6">2 of 3 (wider)</div>
            <div class="box col-12 col-md-3">3 of 3</div>
        </div>
        <div class="row">&nbsp;</div>
        <div class="row">
            <div class="box col-12 col-md-2">1 of 4</div>
            <div class="box col-12 col-md-4">2 of 4</div>
            <div class="box col-12 col-md-4">3 of 4</div>
            <div class="box col-12 col-md-2">4 of 4</div>
        </div>
        <div class="row">&nbsp;</div>
    </div>

</body>
</html>
