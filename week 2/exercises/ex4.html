
<!DOCTYPE html>
<html>

<head>
    <style>

        .box1 {
            width: 200px;
            height: auto;
            margin-left: 50px;
            margin-top: 10px;
            border-radius: 5px;
            border: thick solid navy;
            padding: 10px;
            background-color: gray;
        }

        .box2 {
            width: 400px;
            height: auto;
            margin: 10px 10px 10px 10px;
            border: 5px dashed rgb(59, 55, 49);
            padding: 5px;
            background-color: gray;
        }

        img {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    
    <div class="box1">
        <img src="img/naruto1.jpg" >
    </div>

    <div class="box2">
        <img src="img/naruto2.jpg" >
    </div>
    
</body>

</html>
