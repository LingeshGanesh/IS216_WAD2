	<h2> Feedback Form</h2>
		
	<form class="feedbackForm">
		<label for="mytitle">Title:&nbsp;&nbsp;&nbsp;</label>
		<input type="text" name="title" class="inputBox" id="mytitle" value="Title of Feedback" size="25" />
		<br/>
	
		<label for="myname">Name:&nbsp;</label>
		<input type="text" name="name" class="inputBox" id="myname" value="Enter Your Name" size="25" />
		<br/>
		
		<label for="feedbktype">Type: &nbsp;&nbsp;</label>
		<select name="type" id="feedbktype" class="inputBox">
			<option value="inquiries">Inquiries</option>
			<option value="feedbk" selected>Feedback</option>
			<option value="suggestions">Suggestions</option>
		</select>
		<br/>
		<br/>
		<br/>

		<label for="feedbkdetails">Feedback</label>
		<br/>
			<textarea name="details" id="feedbkdetails" rows="6" cols="50" class="textBox">Comments</textarea>
		<br/>
		<br/>
		<br/>

		<input type="reset" class="submit"/>
		<input type="submit" class="submit"/>

	</form>
