<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {
                font-family: Arial, Helvetica, sans-serif;
                color: darkmagenta;
            }
            table {
                border: 1px solid black;
            }
            th,td {
                border: 1px solid black;
                text-align: center;
            }
            p {
                font-weight: bold;
                font-size: 20px;
            }
        </style>
    </head>

    <body>

        <h1> Learn About Shapes, Colors and Numbers </h1>
        
        <div>
            <p> Shapes </p>
            <table class="table-bordered">
                <tr> 
                    <td>
                        <img src="images/circle.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/square.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/triangle.jpg" heigth="100" width="100"> 
                    </td>
                </tr>
                <tr>
                    <td style="color: red; background-color: aliceblue;"> Circle </td>
                    <td style="color: green; background-color: aliceblue;"> Square </td>

                </tr>
            </table>
        </div>
        <br>
        <div style="margin-left: 100px;">
            <p> Numbers </p>
            <table>
                <tr> 
                    <td>
                        <img src="images/one.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/two.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/three.jpg" heigth="100" width="100">

                </tr>
                <tr>

                    <td style="font-family: 'Courier New', Courier, monospace; background-color: beige;">  Two </td>
                    <td style="font-family: 'Courier New', Courier, monospace; background-color: beige;"> Three </td>
                </tr>
            </table>
        </div>
        <br>
        <div style="margin-left: 150px;">
            <p> Colours</p>
            <table >
                <tr> 
                    <td>
                        <img src="images/blue.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/green.jpg" heigth="100" width="100"> 
                    </td>
                    <td>
                        <img src="images/yellow.jpg" heigth="100" width="100"> 
                    </td>
                </tr>
                <tr>
                    <td style="font-family: Arial, Helvetica, sans-serif; background-color: black; color: blue;"> Blue </td>
